name: apply-mashup-patch
on:
  push:
    branches: [fix/s2s-audio-mashup]
    paths:
      - .grok-briefs/mashup-fix.diff
      - .github/workflows/apply-mashup-patch.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s2s-audio-mashup
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply mashup fix patch once
        run: |
          set -eux
          git config user.email "spencer@softwake.local"
          git config user.name "Spencer Hardy"
          if grep -q 'Always hard-kill LAST_PLAYER' crates/softwake-daemon/src/voice_agent.rs; then
            echo 'mashup fix already present; removing one-shot workflow'
            git rm -f .github/workflows/apply-mashup-patch.yml || true
            if ! git diff --cached --quiet; then
              git commit -m 'chore: remove one-shot apply-mashup-patch workflow'
              git push origin HEAD:fix/s2s-audio-mashup
            fi
            exit 0
          fi
          git apply .grok-briefs/mashup-fix.diff
          git add crates/softwake-daemon/src/voice_agent.rs crates/softwake-voice/src/playback.rs CHANGELOG.md
          git rm -f .github/workflows/apply-mashup-patch.yml
          git status
          git commit -m "$(cat <<'EOF'
          fix(voice): hard-kill prior PcmPipePlayer on S2S barge

          On barge-in / cancel / new response, always interrupt LAST_PLAYER
          (SIGKILL + drain) before opening a new pipe — finish()-orphans must
          not overlap a new utterance (audio mashup).

          Removes one-shot apply-mashup-patch workflow after applying.
          EOF
          )"
          git push origin HEAD:fix/s2s-audio-mashup
