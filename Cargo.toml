[workspace]
resolver = "3"
members = [
    "crates/softwake-daemon",
    "crates/softwake-state",
    "crates/softwake-audio",
    "crates/softwake-wake",
    "crates/softwake-voice",
    "crates/softwake-session",
    "crates/softwake-tools",
    "crates/softwake-soul",
    "crates/softwake-ipc",
    "crates/softwake-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
softwake-audio = { path = "crates/softwake-audio" }
softwake-ipc = { path = "crates/softwake-ipc" }
softwake-session = { path = "crates/softwake-session" }
softwake-soul = { path = "crates/softwake-soul" }
softwake-state = { path = "crates/softwake-state" }
softwake-tools = { path = "crates/softwake-tools" }
softwake-wake = { path = "crates/softwake-wake" }
softwake-voice = { path = "crates/softwake-voice" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
