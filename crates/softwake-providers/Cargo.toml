[package]
name = "softwake-providers"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Model provider credentials, device-code OAuth, Test probes, chat completion, and secret bag. Mock transport by default."

[features]
default = []
# Opens real HTTPS with ureq. Streaming TTS uses tungstenite+rustls. Off in CI default.
live-http = ["dep:ureq", "dep:tungstenite"]

[dependencies]
keyring = { version = "=3.6.3", default-features = false, features = [
    "sync-secret-service",
    "crypto-rust",
    "apple-native",
    "windows-native",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "2.12", default-features = true, optional = true }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
tungstenite = { version = "0.24", optional = true, default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots",
] }

[lints]
workspace = true
