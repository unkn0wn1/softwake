[package]
name = "softwake-providers"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Model provider credentials, device-code OAuth, Test probes, and secret bag. Mock transport by default."

[features]
default = []
# Opens real HTTPS with ureq. Off in CI. Unit tests stay on MockTransport.
live-http = ["dep:ureq"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "2.12", default-features = true, optional = true }

[lints]
workspace = true
