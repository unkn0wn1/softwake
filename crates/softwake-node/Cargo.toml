[package]
name = "softwake-node"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Softwake companion node (Remote Agent). Presence, fire leases, durable outbox, mirrored soul/skills/tools + agent_task LLM + opt-in OAuth vault + Telegram sticky over Tailscale."

[[bin]]
name = "softwake-node"
path = "src/main.rs"

[features]
default = ["live-http"]
live-http = ["softwake-providers/live-http"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
softwake-connectors.workspace = true
softwake-providers.workspace = true
softwake-skills.workspace = true
softwake-soul.workspace = true
softwake-tools.workspace = true
ureq = "2.12"

[lints]
workspace = true
