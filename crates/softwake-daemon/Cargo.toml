[package]
name = "softwake-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Softwake daemon process"

[[bin]]
name = "softwaked"
path = "src/main.rs"

[lib]
name = "softwake_daemon"
path = "src/lib.rs"

[dependencies]
softwake-audio.workspace = true
softwake-connectors.workspace = true
softwake-ipc.workspace = true
softwake-memory.workspace = true
softwake-policy.workspace = true
softwake-providers.workspace = true
softwake-session.workspace = true
softwake-soul.workspace = true
softwake-state.workspace = true
softwake-tools.workspace = true
softwake-wake.workspace = true
softwake-voice.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
# Real chat completion for typed ask/chat. Off in CI and the default binary.
live-http = ["softwake-providers/live-http"]
# Real PipeWire microphone capture for serve. Off in CI.
pipewire-capture = ["softwake-audio/pipewire-native"]

[lints]
workspace = true
