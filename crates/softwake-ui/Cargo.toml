[package]
name = "softwake-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Softwake settings window. Status and buttons talk to the daemon socket. Provider Settings stay in-process."

[lib]
name = "softwake_ui"
path = "src/lib.rs"

[[bin]]
name = "softwake-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
softwake-ipc.workspace = true
softwake-providers = { workspace = true }
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol", "live-http"]
custom-protocol = ["tauri/custom-protocol"]
# Real HTTPS for Settings Test and xAI device-code. Off only for a no-network UI build.
live-http = ["softwake-providers/live-http"]

[lints]
workspace = true
