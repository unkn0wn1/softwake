[package]
name = "softwake-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Softwake settings window, system tray, and always-on-top HUD. Status talks to the daemon. Provider Settings and General pack editors stay in-process."

[lib]
name = "softwake_ui"
path = "src/lib.rs"

[[bin]]
name = "softwake-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
softwake-connectors.workspace = true
softwake-ipc.workspace = true
softwake-providers = { workspace = true }
softwake-soul.workspace = true
softwake-tools.workspace = true
softwake-skills.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.5.5"
url = "2"
argon2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
keyring = { version = "=3.6.3", default-features = false, features = [
    "sync-secret-service",
    "crypto-rust",
    "apple-native",
    "windows-native",
] }

[features]
default = ["custom-protocol", "live-http"]
custom-protocol = ["tauri/custom-protocol"]
# Real HTTPS for Settings Test and xAI device-code. Off only for a no-network UI build.
live-http = ["softwake-providers/live-http"]

[lints]
workspace = true
