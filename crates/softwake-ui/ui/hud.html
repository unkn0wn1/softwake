<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Softwake</title>
    <link rel="stylesheet" href="hud.css" />
  </head>
  <body>
    <div id="capsule" class="capsule" role="button" tabindex="0" aria-expanded="false" aria-label="Softwake listening capsule">
      <canvas id="bloom" width="120" height="120" aria-hidden="true"></canvas>
      <div id="strip" class="strip" hidden>
        <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        <p id="live" class="live" hidden></p>
        <form id="ask-form" autocomplete="off">
          <button type="button" id="talk" aria-label="Hold to talk" aria-pressed="false">
            <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
              />
            </svg>
          </button>
          <input
            id="ask-input"
            type="text"
            maxlength="2000"
            placeholder="Ask Softwake…"
            aria-label="Ask Softwake"
          />
          <button type="submit" id="ask-send">Send</button>
        </form>
      </div>
      <p id="hint" class="hint" hidden>click to type · hold to talk</p>
    </div>
    <script src="hud.js"></script>
  </body>
</html>
