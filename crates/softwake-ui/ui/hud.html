<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Softwake</title>
    <link rel="stylesheet" href="hud.css" />
  </head>
  <body>
    <div id="capsule" class="capsule" role="button" tabindex="0" aria-expanded="false" aria-label="Softwake listening capsule">
      <button type="button" id="mic-mute" class="mic-mute" hidden aria-pressed="false" aria-label="Mute microphone" title="Mute microphone listening">
        <svg class="mic-mute-on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <svg class="mic-mute-slash" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-5.04.3c.03-.17.04-.35.04-.53V5c0-1.66-1.34-3-3-3S8 3.34 8 5v.18l6.96 6.96zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.34 3 3 3 .23 0 .44-.04.65-.09l1.52 1.52c-.66.3-1.39.47-2.17.47-2.76 0-5.01-2.24-5.01-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c.57-.08 1.12-.24 1.64-.46L19.73 21 21 19.73 4.27 3z"/>
        </svg>
      </button>
      <button type="button" id="pin" class="pin" hidden aria-pressed="false" aria-label="Pin chat open" title="Pin chat open">
        <svg class="pin-icon pin-icon-off" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
        </svg>
        <svg class="pin-icon pin-icon-on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" hidden>
          <path fill="currentColor" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
        </svg>
      </button>
      <div id="resize-grip" class="resize-grip" hidden aria-hidden="true" title="Drag to resize"></div>
      <canvas id="bloom" width="120" height="120" aria-hidden="true"></canvas>
      <div id="strip" class="strip" hidden>
      <nav id="profile-rail" class="profile-rail" aria-label="Profiles">
        <ul id="profile-rail-list" class="profile-rail-list" role="listbox" aria-label="Active profile"></ul>
      </nav>
      <div id="strip-main" class="strip-main">
      <div id="vault-gate" class="vault-gate" hidden>
        <p id="vault-title" class="vault-title">Chat lock</p>
        <p id="vault-hint" class="vault-hint"></p>
        <label class="vault-field" id="vault-pass-wrap" hidden>
          <span class="sr-only">Passphrase</span>
          <input id="vault-pass" type="password" autocomplete="current-password" placeholder="Passphrase" />
        </label>
        <p id="vault-error" class="vault-error" role="status" hidden></p>
        <div class="vault-actions">
          <button type="button" id="vault-unlock" hidden>Unlock</button>
          <button type="button" id="vault-set" hidden>Set passphrase</button>
          <button type="button" id="vault-skip" hidden>Skip (plaintext)</button>
        </div>
      </div>
        <div id="chat-toolbar" class="chat-toolbar" hidden>
          <button type="button" id="select-toggle" aria-pressed="false" title="Select messages">Select</button>
          <button type="button" id="delete-selected" disabled title="Delete selected">Delete</button>
          <span id="select-count" class="select-count" hidden></span>
        </div>
        <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        <p id="live" class="live" hidden></p>
        <div id="hud-pending" hidden>
          <strong id="hud-pending-name"></strong>
          <p id="hud-pending-desc"></p>
          <p id="hud-pending-args" hidden></p>
          <div class="hud-actions">
            <button type="button" id="hud-approve">Approve</button>
            <button type="button" id="hud-deny">Deny</button>
          </div>
        </div>
        <div id="hud-allow" hidden>
          <p id="hud-allow-text"></p>
          <div class="hud-actions">
            <button type="button" id="hud-allow-yes">Always allow</button>
            <button type="button" id="hud-allow-no">Not now</button>
          </div>
        </div>
        <div id="context-meter" class="context-meter" hidden>
          <div class="context-meter-track" aria-hidden="true">
            <div id="context-meter-fill" class="context-meter-fill"></div>
            <div id="context-meter-mark" class="context-meter-mark" title="Auto-compact threshold"></div>
          </div>
          <p id="context-meter-label" class="context-meter-label"></p>
        </div>
        <form id="ask-form" autocomplete="off">
          <button type="button" id="talk" aria-label="Hold to talk" aria-pressed="false">
            <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
              />
            </svg>
          </button>
          <textarea
            id="ask-input"
            rows="2"
            maxlength="2000"
            placeholder="Ask…  /help /clear /model /voice /sleep"
            aria-label="Ask Softwake"
          ></textarea>
          <button type="button" id="ask-cancel" hidden>Cancel</button>
          <button type="submit" id="ask-send">Send</button>
        </form>
      </div>
      </div>
      <p id="hint" class="hint" hidden>click to type · hold to talk</p>
      <p id="hud-build" class="hud-build" hidden title="Softwake build"></p>
    </div>
    <script src="hud.js"></script>
  </body>
</html>
