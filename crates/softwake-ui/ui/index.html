<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Softwake</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Softwake</p>
      <h1 id="state">…</h1>
      <p id="capture" class="meta"></p>
      <p id="soul" class="meta"></p>
      <p id="reload" class="meta"></p>
      <p class="meta">Reload reads soul.md, user.md, rules.md, and glossary.md.</p>
      <p id="detail" class="detail"></p>
      <p id="last-tool" class="meta"></p>
      <p id="pending" class="detail"></p>
      <p id="error" class="error" role="status"></p>
      <div class="actions">
        <button type="button" id="hibernate">Hibernate</button>
        <button type="button" id="wake">Wake</button>
        <button type="button" id="sleep">Sleep</button>
        <button type="button" id="reload-soul">Reload soul</button>
        <button type="button" id="confirm" disabled>Confirm</button>
        <button type="button" id="cancel" disabled>Cancel</button>
      </div>

      <section class="settings" aria-labelledby="settings-title">
        <h2 id="settings-title">Model providers</h2>
        <p class="meta">
          Pick a provider, save a key or sign in, press Test, then choose a model. The
          model list stays empty until Test succeeds.
        </p>
        <label class="field">
          <span>Provider</span>
          <select id="provider-select"></select>
        </label>
        <div id="key-panel" class="stack hidden">
          <label id="base-url-field" class="field hidden">
            <span>Base URL</span>
            <input id="base-url" type="url" placeholder="https://host/v1" autocomplete="off" spellcheck="false" />
          </label>
          <label class="field">
            <span>API key</span>
            <input id="api-key" type="password" autocomplete="off" spellcheck="false" />
          </label>
          <div class="row">
            <button type="button" id="save-key">Save key</button>
            <button type="button" id="save-base-url" class="hidden">Save base URL</button>
            <button type="button" id="clear-key">Clear saved</button>
          </div>
        </div>
        <div id="oauth-panel" class="stack hidden">
          <p id="oauth-status" class="meta">Not signed in.</p>
          <p id="oauth-code" class="detail"></p>
          <div class="row">
            <button type="button" id="oauth-start">Start sign-in</button>
            <button type="button" id="oauth-poll" disabled>Poll</button>
            <button type="button" id="oauth-sign-out">Sign out</button>
          </div>
        </div>
        <div class="row">
          <button type="button" id="provider-test">Test</button>
        </div>
        <p id="test-status" class="meta">Test: not run</p>
        <label class="field">
          <span>Model</span>
          <select id="model-select" disabled>
            <option value="">Test to load models</option>
          </select>
        </label>
        <p id="provider-error" class="error" role="status"></p>
        <p id="plaintext-warning" class="detail"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
