<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Softwake</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Softwake</p>
      <h1 id="state">…</h1>
      <p id="capture" class="meta"></p>
      <p id="soul" class="meta"></p>
      <p id="reload" class="meta"></p>
      <p id="detail" class="detail"></p>
      <p id="last-tool" class="meta"></p>
      <p id="pending" class="detail"></p>
      <p id="error" class="error" role="status"></p>
      <div class="actions">
        <button type="button" id="hibernate">Hibernate</button>
        <button type="button" id="wake">Wake</button>
        <button type="button" id="sleep">Sleep</button>
        <button type="button" id="reload-soul">Reload soul</button>
        <button type="button" id="confirm" disabled>Confirm</button>
        <button type="button" id="cancel" disabled>Cancel</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
