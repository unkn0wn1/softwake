[[permission]]
identifier = "allow-status"
description = "Read voice state from the daemon."
commands.allow = ["status"]

[[permission]]
identifier = "allow-hibernate"
description = "Ask the daemon to hibernate."
commands.allow = ["hibernate"]

[[permission]]
identifier = "allow-resume"
description = "Ask the daemon to leave hibernate."
commands.allow = ["resume"]

[[permission]]
identifier = "allow-sleep"
description = "Ask the daemon to sleep."
commands.allow = ["sleep"]

[[permission]]
identifier = "allow-reload-soul"
description = "Ask the daemon to record a soul reload."
commands.allow = ["reload_soul"]

[[permission]]
identifier = "allow-set-voice-test"
description = "Turn voice test mode on or off. Microphone speech is not sent to chat."
commands.allow = ["set_voice_test"]

[[permission]]
identifier = "allow-confirm-tool"
description = "Confirm a pending tool."
commands.allow = ["confirm_tool"]

[[permission]]
identifier = "allow-cancel-tool"
description = "Cancel a pending tool."
commands.allow = ["cancel_tool"]

[[permission]]
identifier = "allow-provider-snapshot"
description = "Read provider Settings. The snapshot has no keys or tokens."
commands.allow = ["provider_snapshot"]

[[permission]]
identifier = "allow-provider-select"
description = "Select the acting provider."
commands.allow = ["provider_select"]

[[permission]]
identifier = "allow-provider-set-key"
description = "Save an API key into the local secret bag."
commands.allow = ["provider_set_key"]

[[permission]]
identifier = "allow-provider-set-base-url"
description = "Save the OpenAI-compatible base URL."
commands.allow = ["provider_set_base_url"]

[[permission]]
identifier = "allow-provider-clear-cred"
description = "Clear the saved credential for a provider."
commands.allow = ["provider_clear_cred"]

[[permission]]
identifier = "allow-provider-oauth-start"
description = "Start xAI device-code sign-in."
commands.allow = ["provider_oauth_start"]

[[permission]]
identifier = "allow-provider-oauth-poll"
description = "Poll xAI device-code sign-in."
commands.allow = ["provider_oauth_poll"]

[[permission]]
identifier = "allow-provider-oauth-sign-out"
description = "Clear saved xAI sign-in."
commands.allow = ["provider_oauth_sign_out"]

[[permission]]
identifier = "allow-provider-test"
description = "Run Settings Test for the selected provider."
commands.allow = ["provider_test"]

[[permission]]
identifier = "allow-provider-set-model"
description = "Save the selected chat model id."
commands.allow = ["provider_set_model"]

[[permission]]
identifier = "allow-provider-set-voice-model"
description = "Save the selected voice / STT model id."
commands.allow = ["provider_set_voice_model"]

[[permission]]
identifier = "allow-provider-set-tts-voice"
description = "Save the selected xAI TTS voice id."
commands.allow = ["provider_set_tts_voice"]

[[permission]]
identifier = "allow-provider-set-context-limit"
description = "Save the context window override in tokens."
commands.allow = ["provider_set_context_limit"]

[[permission]]
identifier = "allow-provider-set-compact-at"
description = "Save the compaction threshold percent."
commands.allow = ["provider_set_compact_at"]

[[permission]]
identifier = "allow-provider-opt-in-plaintext"
description = "Opt in to a local plaintext secret file. The command writes no key."
commands.allow = ["provider_opt_in_plaintext"]

[[permission]]
identifier = "allow-email-snapshot"
description = "Read email Settings. The snapshot has no password."
commands.allow = ["email_snapshot"]

[[permission]]
identifier = "allow-email-save"
description = "Save email Settings and optional SMTP password."
commands.allow = ["email_save"]

[[permission]]
identifier = "allow-email-clear-password"
description = "Clear the saved SMTP password."
commands.allow = ["email_clear_password"]

[[permission]]
identifier = "allow-email-test"
description = "Validate live email configuration without sending mail."
commands.allow = ["email_test"]

[[permission]]
identifier = "allow-pack-snapshot"
description = "Read the four soul-pack files for a profile in the Profiles editors."
commands.allow = ["pack_snapshot"]

[[permission]]
identifier = "allow-pack-save"
description = "Write the four soul-pack files for a profile in the Profiles editors."
commands.allow = ["pack_save"]

[[permission]]
identifier = "allow-wake"
description = "Enter awake from sleep when the soul pack is valid."
commands.allow = ["wake"]

[[permission]]
identifier = "allow-ask"
description = "Send one typed ask while the daemon is awake."
commands.allow = ["ask"]

[[permission]]
identifier = "allow-hud-snapshot"
description = "Read voice state and a mock listening level for the HUD capsule."
commands.allow = ["hud_snapshot"]

[[permission]]
identifier = "allow-hud-ask"
description = "Submit a typed line from the HUD (wake then ask from sleep)."
commands.allow = ["hud_ask"]

[[permission]]
identifier = "allow-hud-talk-start"
description = "Arm press-to-talk on the daemon (wake from sleep; refuse hibernate)."
commands.allow = ["hud_talk_start"]

[[permission]]
identifier = "allow-hud-talk-stop"
description = "Release press-to-talk, transcribe, ask, and speak the reply."
commands.allow = ["hud_talk_stop"]

[[permission]]
identifier = "allow-hud-set-layout"
description = "Resize and re-anchor the HUD capsule when expanding or collapsing."
commands.allow = ["hud_set_layout"]

[[permission]]
identifier = "allow-hud-start-drag"
description = "Begin dragging the always-on-top HUD capsule."
commands.allow = ["hud_start_drag"]

[[permission]]
identifier = "allow-hud-save-position"
description = "Persist the HUD capsule position after a drag."
commands.allow = ["hud_save_position"]

[[permission]]
identifier = "allow-hud-reset-position"
description = "Clear a saved HUD position and park at primary bottom-right."
commands.allow = ["hud_reset_position"]

[[permission]]
identifier = "allow-profiles-snapshot"
description = "List Softwake profiles and load the selected pack into the Profiles editors."
commands.allow = ["profiles_snapshot"]

[[permission]]
identifier = "allow-profile-create"
description = "Create a new Softwake profile from starter pack templates."
commands.allow = ["profile_create"]

[[permission]]
identifier = "allow-profile-rename"
description = "Rename the agent for a Softwake profile."
commands.allow = ["profile_rename"]

[[permission]]
identifier = "allow-profile-set-active"
description = "Switch the active Softwake profile used on the next awake."
commands.allow = ["profile_set_active"]

[[permission]]
identifier = "allow-tools-snapshot"
description = "Load Tools Settings."
commands.allow = ["tools_snapshot"]

[[permission]]
identifier = "allow-tools-save"
description = "Save Tools Settings."
commands.allow = ["tools_save"]

[[permission]]
identifier = "allow-ui-prefs-snapshot"
description = "Read Settings UI prefs (text size)."
commands.allow = ["ui_prefs_snapshot"]

[[permission]]
identifier = "allow-ui-prefs-set-text-size"
description = "Save Settings UI text size."
commands.allow = ["ui_prefs_set_text_size"]

[[permission]]
identifier = "allow-kws-thresholds-snapshot"
description = "Read KWS wake-word thresholds for Settings General."
commands.allow = ["kws_thresholds_snapshot"]

[[permission]]
identifier = "allow-kws-thresholds-set"
description = "Save KWS wake-word thresholds and apply them live to the daemon."
commands.allow = ["kws_thresholds_set"]

[[permission]]
identifier = "allow-free-speech-silence-snapshot"
description = "Read free-speech end-of-utterance silence for Settings General."
commands.allow = ["free_speech_silence_snapshot"]

[[permission]]
identifier = "allow-free-speech-silence-set"
description = "Save free-speech end-of-utterance silence and apply it live to the daemon."
commands.allow = ["free_speech_silence_set"]
